<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ef4444"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="800" height="640" fill="#f8fafc"/>

  <text x="28" y="40" font-size="21" font-weight="700" fill="#0f172a">Plateforme SOC/SOAR</text>
  <text x="28" y="62" font-size="13" fill="#64748b">Laboratoire VMware · trois zones séparées par pfSense</text>

  <!-- Zone WAN -->
  <rect x="24" y="80" width="752" height="96" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="40" y="92" width="52" height="22" rx="11" fill="#fee2e2"/>
  <text x="66" y="107" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">WAN</text>
  <g filter="url(#sh)">
    <rect x="110" y="104" width="220" height="56" rx="10" fill="#ffffff" stroke="#fca5a5"/>
  </g>
  <rect x="110" y="104" width="6" height="56" rx="3" fill="#ef4444"/>
  <text x="226" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Kali Linux</text>
  <text x="226" y="148" text-anchor="middle" font-size="12" fill="#64748b">attaquant</text>

  <!-- pfSense -->
  <g filter="url(#sh)">
    <rect x="270" y="210" width="260" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="400" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">pfSense</text>
  <text x="400" y="255" text-anchor="middle" font-size="12" fill="#3b82f6">pare-feu · NAT</text>

  <!-- Zone DMZ -->
  <rect x="24" y="300" width="360" height="196" rx="14" fill="#fffbeb" stroke="#fde68a"/>
  <rect x="40" y="312" width="52" height="22" rx="11" fill="#fef3c7"/>
  <text x="66" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">DMZ</text>
  <g filter="url(#sh)">
    <rect x="44" y="346" width="320" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="44" y="424" width="320" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="44" y="346" width="6" height="56" rx="3" fill="#f59e0b"/>
  <rect x="44" y="424" width="6" height="56" rx="3" fill="#f59e0b"/>
  <text x="204" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Metasploitable</text>
  <text x="204" y="390" text-anchor="middle" font-size="12" fill="#64748b">serveur cible</text>
  <text x="204" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Snort</text>
  <text x="204" y="468" text-anchor="middle" font-size="12" fill="#64748b">détection d'intrusion</text>

  <!-- Zone SOC -->
  <rect x="416" y="300" width="360" height="274" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="432" y="312" width="52" height="22" rx="11" fill="#dcfce7"/>
  <text x="458" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">SOC</text>
  <g filter="url(#sh)">
    <rect x="436" y="346" width="320" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="436" y="426" width="320" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="436" y="506" width="320" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="436" y="346" width="6" height="56" rx="3" fill="#22c55e"/>
  <rect x="436" y="426" width="6" height="56" rx="3" fill="#22c55e"/>
  <rect x="436" y="506" width="6" height="56" rx="3" fill="#22c55e"/>
  <text x="596" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Shuffle</text>
  <text x="596" y="390" text-anchor="middle" font-size="12" fill="#64748b">automatisation de la réponse</text>
  <text x="596" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TheHive + Cortex</text>
  <text x="596" y="470" text-anchor="middle" font-size="12" fill="#64748b">gestion et analyse des incidents</text>
  <text x="596" y="530" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MISP</text>
  <text x="596" y="550" text-anchor="middle" font-size="12" fill="#64748b">renseignement sur les menaces</text>

  <!-- Flèches : attaque -->
  <g fill="none" stroke="#ef4444" stroke-width="2">
    <path d="M200 160V239H270" marker-end="url(#ar)"/>
    <path d="M330 268V346" marker-end="url(#ar)"/>
  </g>
  <!-- Flèches : réponse -->
  <g fill="none" stroke="#475569" stroke-width="2">
    <path d="M364 452H400V374H436" marker-end="url(#ag)"/>
    <path d="M730 346V239H530" marker-end="url(#ag)"/>
    <path d="M596 402V426" marker-end="url(#ag)"/>
    <path d="M596 482V506" marker-end="url(#ag)"/>
  </g>

  <!-- Numéros des étapes -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="200" cy="200" r="11" fill="#ef4444"/><text x="200" y="204">1</text>
    <circle cx="330" cy="288" r="11" fill="#ef4444"/><text x="330" y="292">2</text>
    <circle cx="400" cy="413" r="11" fill="#475569"/><text x="400" y="417">3</text>
    <circle cx="730" cy="276" r="11" fill="#475569"/><text x="730" y="280">4</text>
    <circle cx="616" cy="414" r="11" fill="#475569"/><text x="616" y="418">5</text>
    <circle cx="616" cy="494" r="11" fill="#475569"/><text x="616" y="498">6</text>
  </g>

  <!-- Légende -->
  <g font-size="12" fill="#334155">
    <circle cx="36" cy="607" r="8" fill="#ef4444"/><text x="36" y="611" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
    <text x="50" y="611">attaque</text>
    <circle cx="124" cy="607" r="8" fill="#ef4444"/><text x="124" y="611" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
    <text x="138" y="611">redirection NAT</text>
    <circle cx="258" cy="607" r="8" fill="#475569"/><text x="258" y="611" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
    <text x="272" y="611">alerte</text>
    <circle cx="338" cy="607" r="8" fill="#475569"/><text x="338" y="611" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
    <text x="352" y="611">blocage de l'attaquant</text>
    <circle cx="512" cy="607" r="8" fill="#475569"/><text x="512" y="611" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
    <text x="526" y="611">création de l'incident</text>
    <circle cx="676" cy="607" r="8" fill="#475569"/><text x="676" y="611" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">6</text>
    <text x="690" y="611">enrichissement</text>
  </g>
</svg>
